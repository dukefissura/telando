# Alternativa ao `pnpm dev:livekit` para quem tem Docker.
services:
  livekit:
    image: livekit/livekit-server:v1.13.7
    command: --dev --bind 0.0.0.0 --config /etc/livekit.yaml
    volumes:
      - ./livekit.dev.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
