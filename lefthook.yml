pre-commit:
  commands:
    biome:
      run: pnpm biome check --staged --no-errors-on-unmatched --files-ignore-unknown=true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

# Faz o papel do CI: a conta não usa GitHub Actions, então nada sobe sem passar aqui.
pre-push:
  commands:
    verificar:
      run: pnpm lint && pnpm typecheck && pnpm test
