name: Bug
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: textarea
    id: aconteceu
    attributes:
      label: O que aconteceu
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: "1. Abri o link...\n2. Cliquei em..."
  - type: input
    id: ambiente
    attributes:
      label: Navegador ou versão do app
