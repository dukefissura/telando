appId: app.telando.desktop
productName: Telando
directories:
  output: release
  buildResources: build
# O main, o preload e o renderer já saem empacotados em out/ pelo electron-vite.
files:
  - out/**
  - resources/**
  - package.json
# O instalador registra telando:// no Windows; é por ele que o link da página abre o app.
protocols:
  - name: Telando
    schemes:
      - telando
win:
  target: nsis
  icon: build/icone.png
nsis:
  oneClick: true
  perMachine: false
  # Nome fixo: a página do site aponta para releases/latest/download/Telando-Setup.exe.
  artifactName: Telando-Setup.${ext}
  shortcutName: Telando
publish:
  provider: github
  owner: dukefissura
  repo: telando
